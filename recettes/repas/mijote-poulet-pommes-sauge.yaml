preparation:
- section: Préparation
  etapes:
  - etape: Faire fondre le beurre dans une grande poêle à frire à feu moyen à élevé.
      Ajouter le poulet et cuire jusqu’à ce qu’il soit doré, de 3 à 4 minutes par
      côté. Réduire la température si le poulet devient brun foncé. Entre-temps, vider
      le cœur des pommes non pelées et les couper en huit morceaux chacune. Fouetter
      le jus avec de la moutarde de Dijon jusqu’à consistance homogène.
