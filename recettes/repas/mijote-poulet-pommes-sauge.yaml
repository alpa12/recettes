      rangee: Conserves et sauces
  - etape: Lorsque le poulet est bruni, verser le mélange de jus sur le dessus. Saupoudrez
      de sauge* et de thym. Placer les morceaux de pommes autour du poulet. Réduire
      la chaleur à feu moyen à faible. Recouvrir et cuire jusqu’à ce que le poulet
      soit spongieux lorsque vous exercez une légère pression et que la température
      prise à l’aide d’un thermomètre à viande atteigne 165 °F (74 °C), environ 4
      minutes par côté pour des poitrines et 3 minutes pour des cuisses. Retourner
      les pommes à l’occasion. Placer le poulet et les morceaux de pommes dans une
      assiette.
    ingredients:
