  - etape: Mettre le feu à élevé. Utiliser une cuillère en bois pour gratter les petits
      morceaux de viande au fond de la poêle. Faire bouillir, à découvert en brassant
      à l’occasion, jusqu’à ce que le jus se soit transformé en un glaçage épais,
      environ 3 minutes. Verser dans la sauce les jus du poulet prélevés dans l’assiette.
      Verser sur le poulet.
