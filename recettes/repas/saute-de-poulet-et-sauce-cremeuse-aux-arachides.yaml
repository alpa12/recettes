nom: Sauté de poulet et sauce crémeuse aux arachides
nom_court: saute-de-poulet-et-sauce-cremeuse-aux-arachides
source: https://www.kraftheinz.com/fr-CA/kraft-peanut-butter/recettes/577143-saute-de-poulet-et-sauce-cremeuse-aux-arachides
portions: 4.0
se_congele: no
difficulte: Facile
cout: $
allergenes:
- Arachides
- Soya
- Coco
categories:
- Dîner
- Poulet
- Asiatique
- Sauté
- Rapide
temps:
  preparation: 10
  cuisson: 15
  refrigeration: ~
preparation:
- section: Préparation
  etapes:
  - etape: Cuire le riz selon le mode d'emploi, sans ajouter de sel.
    image_guid: ~
    ingredients:
    - nom: riz brun instantané
      qte: 1.5
      uni: tasse
      qte_volume: 1.5
      uni_volume: tasse
      rangee: Epicerie
    equipements: []
  - etape: Entre-temps, cuire le beurre d'arachide, le lait de noix de coco, la sauce
      soya, la sauce sriracha et l'ail dans une casserole à feu doux 3 min ou jusqu'à
      ce que le tout soit chaud, en remuant souvent. Garder au chaud.
    image_guid: ~
    ingredients:
    - nom: beurre d’arachide crémeux KRAFT
      qte: 0.5
      uni: tasse
      qte_volume: 0.5
      uni_volume: tasse
      rangee: Epicerie
    - nom: lait de coco
      qte: 0.5
      uni: tasse
      qte_volume: 0.5
      uni_volume: tasse
      rangee: Conserves et sauces
    - nom: sauce soya à teneur réduite en sodium
      qte: 1.0
      uni: c. à soupe
      qte_volume: 1.0
      uni_volume: c. à soupe
      rangee: Conserves et sauces
    - nom: sauce Sriracha
      qte: 1.0
      uni: c. à soupe
      qte_volume: 1.0
      uni_volume: c. à soupe
      rangee: Conserves et sauces
    - nom: ail haché
      qte: 1.0
      uni: gousse
      rangee: Fruits et legumes
    equipements: Casserole
  - etape: Faire sauter le poulet à feu mi-vif dans une grande poêle vaporisée d'un
      enduit à cuisson 5 min ou jusqu'à ce qu'il soit uniformément doré. Ajouter les
      légumes et 3 c. à soupe de la sauce au beurre d'arachide; faire sauter 5 min
      ou jusqu'à ce que le poulet soit bien cuit et que tous les ingrédients soient
      chauds.
    image_guid: ~
    ingredients:
    - nom: poitrine de poulet désossée
      qte: 1.0
      uni: lbs
      qte_masse: 1.0
      uni_masse: lbs
      rangee: Viandes et substituts
    - nom: légumes surgelés pour sauté
      qte: 3.0
      uni: tasse
      qte_volume: 3.0
      uni_volume: tasse
      rangee: Fruits et legumes
    equipements: Grande poêle
  - etape: Mettre le riz dans une assiette; garnir du mélange de poulet et du reste
      de la sauce au beurre d'arachide.
    image_guid: ~
    ingredients: []
    equipements: []
commentaires: []
