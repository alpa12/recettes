preparation:
- etapes:
  - etape: Dans une grande casserole à feu moyen-élevé, dorer l’oignon et le piment
      dans le beurre. Ajouter la viande et cuire en l'émiettant à la cuillère de bois
      jusqu’à ce qu’elle soit légèrement dorée. Saler et poivrer. Ajouter l’ail, les
      épices et poursuivre la cuisson 2 minutes en remuant.
